[project]
name = "health-insurance"
version = "0.1.0"
description = "Mini-progetto di ML clinico: regressione delle spese sanitarie individuali (Medical Cost Personal) con pipeline riproducibile e app Streamlit"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<2.2",
    "pandas>=2.1,<2.3",
    "scipy>=1.11,<1.15",
    "scikit-learn>=1.4,<1.7",
    "matplotlib>=3.8",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_insurance"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
